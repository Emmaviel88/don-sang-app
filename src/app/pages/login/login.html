<div class="login-container bg-dark">
  <h1>Connexion</h1>

  <form (ngSubmit)="seConnecter()" class="bg-dark text-white">
    <label for="login">Utilisateur</label>

    <select
      class="bg-dark text-white"
      id="login"
      name="login"
      [(ngModel)]="login"
      (change)="$any($event.target).value && champMotDePasse.focus()"
      required
      [disabled]="chargement()"
    >
      <option value="" class="bg-dark text-white">Sélectionnez votre nom</option>

      @for (utilisateur of logins(); track utilisateur.login) {
        <option [value]="utilisateur.login" class="bg-dark text-white">
          {{ utilisateur.nomComplet }}
        </option>
      }
    </select>

    <label for="password">Mot de passe</label>

    <div class="champ-mot-de-passe">
      <input
        #champMotDePasse
        id="password"
        name="password"
        [type]="motDePasseVisible() ? 'text' : 'password'"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
        [disabled]="chargement()"
        class="bg-dark text-white"
      />

      <button
        type="button"
        class="bouton-oeil"
        aria-label="Maintenir appuyé pour afficher le mot de passe"
        [disabled]="chargement()"
        (pointerdown)="afficherMotDePasse($event)"
        (pointerup)="masquerMotDePasse()"
        (pointerleave)="masquerMotDePasse()"
        (pointercancel)="masquerMotDePasse()"
        (contextmenu)="$event.preventDefault()"
      >
        <i
          class="bi"
          [class.bi-eye]="!motDePasseVisible()"
          [class.bi-eye-slash]="motDePasseVisible()"
        ></i>
      </button>
    </div>

    <button type="submit" [disabled]="chargement()">
      @if (chargement()) {
        <span class="spinner"></span>
        Vérification en cours...
      } @else {
        Se connecter
      }
    </button>
  </form>

  @if (message()) {
    <p>{{ message() }}</p>
  }
</div>
